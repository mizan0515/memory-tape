<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>기억의 안쪽으로 · 삽입 예제</title><link rel="icon" href="data:,"><style>*{box-sizing:border-box}body{margin:0;background:#030507;color:#edf2fb;font:16px system-ui}iframe{width:100%;height:100dvh;border:0;position:fixed;inset:0;transition:opacity .35s}iframe.finished{opacity:0;pointer-events:none}main{height:100dvh;display:grid;place-content:center;text-align:center;padding:24px}button{font:inherit;padding:12px 22px;border:1px solid #fff4;border-radius:28px;background:transparent;color:inherit;cursor:pointer}#state{font-size:12px;color:#9caabc;position:fixed;bottom:8px;left:16px;z-index:3;pointer-events:none}</style></head><body><main><h1>다음 이야기</h1><p>여기에 연결할 웹페이지의 콘텐츠를 넣으세요.</p><button id="again">다시 바라보기</button></main><iframe id="memory" title="기억의 안쪽으로" allow="fullscreen" loading="eager"></iframe><p id="state" role="status">장면을 준비하고 있어요</p><script>
const frame=document.getElementById('memory'),status=document.getElementById('state');
// In production use your published address, or pass ?viewer=https://.../ .
const address=new URLSearchParams(location.search).get('viewer')||'./';
const source=new URL(address,location.href);if(!['https:','http:'].includes(source.protocol))throw Error('HTTP(S) viewer required');frame.src=source.href;
function command(command,extra={}){frame.contentWindow.postMessage({channel:'memory-tape',version:1,command,...extra},source.origin);}
window.addEventListener('message',e=>{if(e.source!==frame.contentWindow||e.origin!==source.origin||e.data?.channel!=='memory-tape'||e.data.version!==1)return;const event=e.data.event;document.body.dataset.event=event;status.textContent=event==='ready'?'드래그 · 스크롤 · 테이프 안으로':event==='start'?'':event==='complete'?'전환 완료':event==='error'?'장면을 열 수 없습니다':'';if(event==='covered'||event==='complete')frame.classList.add('finished');});
document.getElementById('again').onclick=()=>{frame.classList.remove('finished');command('reset');status.textContent='드래그 · 스크롤 · 테이프 안으로';};
</script></body></html>
