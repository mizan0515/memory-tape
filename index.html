<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="카세트를 돌며 바라보고, 기억의 안쪽으로 들어가세요."><title>기억의 안쪽으로</title><link rel="icon" href="data:,"><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#030507;color:#f1f4fb;font-family:system-ui,sans-serif}button{font:inherit;color:inherit;cursor:pointer;border:1px solid #ffffff30;border-radius:30px;background:#111923bd;padding:11px 18px;backdrop-filter:blur(12px)}button:hover{background:#263548}button:focus-visible,#stage:focus-visible{outline:2px solid #b9e6ff;outline-offset:4px}button:disabled{opacity:.35;cursor:wait}[hidden]{display:none!important}#stage{position:absolute;inset:0;display:grid;place-items:center;touch-action:none;outline:0;cursor:grab}#stage:active{cursor:grabbing}#viewport{position:relative;overflow:hidden}canvas{display:block;width:100%;height:100%}.overlay{position:absolute;z-index:3;left:0;right:0;display:flex;align-items:center;justify-content:space-between;pointer-events:none;padding:clamp(18px,4vw,44px);gap:12px}.overlay>*{pointer-events:auto}.top{top:0}.bottom{bottom:0;align-items:flex-end}.title{font-size:clamp(14px,2vw,18px);letter-spacing:.12em;font-weight:500;text-shadow:0 2px 15px #000}.hint{margin:7px 0 0;color:#bcc4d1;font-size:12px}.actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}#ambient[aria-pressed=true]{border-color:#b4dbf56b}#play{background:#edf2fb;color:#162331;border-color:transparent;font-weight:600}#loading,#error{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:#030507;z-index:8;font-size:14px}#errorText{max-width:80vw;overflow-wrap:anywhere;color:#b7c4d5}.spinner{width:24px;height:24px;border:1px solid #ffffff30;border-top-color:#d6edff;border-radius:50%;animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(1turn)}}#destination{position:absolute;inset:0;background:#030507;display:grid;place-content:center;text-align:center;z-index:5}.hide-ui .overlay{display:none}@media(max-width:600px){.bottom{align-items:center;flex-direction:column}.hint{text-align:center}.actions{justify-content:center}button{padding:10px 14px;font-size:13px}.top{padding:20px}.title{font-size:14px}}@media(prefers-reduced-motion:reduce){.spinner{animation:none}}
</style></head><body>
<section id="stage" tabindex="0" aria-label="드래그로 회전, 스크롤로 접근. 아래로 스크롤하면 처음 장면으로 돌아갑니다."><div id="viewport"><div id="destination" hidden><h1>기억의 안쪽으로</h1><button id="return">다시 바라보기</button></div></div><div id="loading" role="status"><span class="spinner"></span><strong>장면을 준비하고 있어요</strong></div><div id="error" role="alert" hidden><strong>장면을 열 수 없습니다</strong><p id="errorText"></p><button onclick="location.reload()">다시 시도</button></div></section>
<div class="overlay top"><span class="title">기억의 안쪽으로</span><button id="reset" disabled>처음으로</button></div>
<div class="overlay bottom"><p class="hint">드래그로 회전 · 스크롤로 가까이</p><div class="actions"><button id="ambient" disabled aria-pressed="true">잔잔한 회전</button><button id="play" disabled>테이프 안으로</button></div></div>
<script type="module" src="viewer.js?v=1.0.1"></script></body></html>
